[project]
name = "sentinel-sdk"
version = "0.1.0"
description = "Python SDK for Sentinel ML training supervisor"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]
