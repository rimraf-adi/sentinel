[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "sentinel-ml"
version = "0.1.0"
description = "Sentinel ML Training Supervisor & Framework"
readme = "../../sentinel.md"
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Aditya Kinjawadekar", email = "kinjawadekaradi112@gmail.com" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.maturin]
bindings = "bin"
strip = true
manifest-path = "Cargo.toml"
