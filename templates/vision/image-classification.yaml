schema_version: "1.0"
template_id: "vision/image-classification@v1"
name: "Vision Classification"
description: "PyTorch image classification with AMP, AdamW, and Cosine Annealing"
domain: "vision"
defaults:
  - model: resnet18
  - dataset: synthetic-cifar
  - _self_
parameters:
  model.name:
    type: choice
    default: "resnet18"
    options: ["resnet18", "resnet50", "vit_b_16"]
    help: "Vision backbone architecture"
  training.lr:
    type: float
    default: 0.0003
    range: [0.00001, 0.1]
    help: "Peak learning rate"
  training.batch_size:
    type: int
    default: 64
    range: [8, 512]
    help: "Batch size per device"
  training.epochs:
    type: int
    default: 20
    range: [1, 500]
    help: "Total training epochs"
locked:
  training.precision: "16-mixed"
  tracking.backend: "mlflow"
sweep:
  optimizer: "optuna"
  pruner: "asha"
  max_trials: 20
  parallel_workers: 2
  params:
    training.lr:
      type: "float_log"
      min: 0.00001
      max: 0.01
smoke_test:
  training.epochs: 1
  training.limit_train_batches: 5
  training.limit_val_batches: 2
  device: "cpu"
