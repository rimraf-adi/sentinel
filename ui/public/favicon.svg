<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sentinel">
  <defs>
    <linearGradient id="sentinel-grad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="sentinel-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="34" height="34" rx="8" fill="#08090d" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />
  
  <g filter="url(#sentinel-glow)">
    <path d="M 23.5 11.5 H 15.5 L 10.5 16.5" stroke="url(#sentinel-grad)" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 12 15.5 L 24 20.5" stroke="url(#sentinel-grad)" stroke-width="3.2" stroke-linecap="round" />
    <path d="M 25.5 19.5 L 20.5 24.5 H 12.5" stroke="url(#sentinel-grad)" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" />

    <circle cx="23.5" cy="11.5" r="2.4" fill="#08090d" stroke="url(#sentinel-grad)" stroke-width="1.8" />
    <circle cx="23.5" cy="11.5" r="1.1" fill="#38bdf8" />
    <circle cx="12.5" cy="24.5" r="2.4" fill="#08090d" stroke="url(#sentinel-grad)" stroke-width="1.8" />
    <circle cx="12.5" cy="24.5" r="1.1" fill="#10b981" />
  </g>
</svg>
